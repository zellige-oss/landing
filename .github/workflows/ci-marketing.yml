name: CI marketing

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: ci-marketing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  marketing:
    name: Landing lint, types, build and checks
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: marketing/package-lock.json
      - run: npm ci
        working-directory: marketing
      - run: npm run lint
        working-directory: marketing
      - run: npm run build
        working-directory: marketing
      - name: Check the prerendered page and the packaged artifact
        run: |
          node --test tests/marketing.test.mjs tests/marketing-build.test.mjs tests/pattern-geometry.test.mjs tests/deployment-scope.test.mjs tests/release-head.test.mjs
          node deploy/build-marketing.mjs

  required:
    name: Marketing CI required
    if: ${{ always() && github.event.pull_request.merged == true }}
    needs: [marketing]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every validation to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          results = json.loads(os.environ["RESULTS"])
          failed = [name for name, job in results.items() if job["result"] != "success"]
          if failed:
              raise SystemExit("Required validations did not pass: " + ", ".join(failed))
          print("All required validations passed.")
          PYTHON

  publish:
    name: Deploy validated landing
    needs: [required]
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    uses: ./.github/workflows/deploy-marketing.yml
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

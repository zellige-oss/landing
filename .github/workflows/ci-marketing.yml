name: CI marketing

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-marketing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  marketing:
    name: Landing lint, types, build and checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: marketing/package-lock.json
      - run: npm ci
        working-directory: marketing
      - run: npm run lint
        working-directory: marketing
      - run: npm run build
        working-directory: marketing
      - name: Check the prerendered page and the packaged artifact
        run: |
          node --test tests/marketing.test.mjs tests/marketing-build.test.mjs tests/pattern-geometry.test.mjs tests/deployment-scope.test.mjs tests/release-head.test.mjs tests/sonar-quality-gate.test.mjs
          node deploy/build-marketing.mjs

  sonar:
    name: SonarQube Cloud Quality Gate
    needs: [marketing]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Require the quality gate for this exact commit
        env:
          SONAR_PROJECT_KEY: zellige-oss_landing
          APPROVED_SHA: ${{ github.sha }}
        run: node deploy/sonar-quality-gate.mjs

  required:
    name: Marketing CI required
    if: ${{ always() }}
    needs: [marketing, sonar]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every validation to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          results = json.loads(os.environ["RESULTS"])
          failed = [name for name, job in results.items() if job["result"] != "success"]
          if failed:
              raise SystemExit("Required validations did not pass: " + ", ".join(failed))
          print("All required validations passed.")
          PYTHON

  publish:
    name: Deploy validated landing
    needs: [required]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-marketing.yml
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

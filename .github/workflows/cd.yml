name: CD

# Deploys to Vercel once CI passes on a push to main, using the package CI built.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

# One deployment at a time; a running one is never interrupted. Each waits a minute
# before its tip check below, so a burst of pushes to main (several PRs merged in a
# row) deploys once, for the last of them: the older ones find a newer commit on
# main and skip themselves.
concurrency:
  group: production
  queue: max
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Vercel
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: marketing-production
    env:
      APPROVED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Wait a minute for newer commits on main
        run: sleep 60
      - name: Skip commits that are no longer the tip of main
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$tip" = "$APPROVED_SHA" ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"
          else echo "A newer commit is on main; it will deploy itself."; fi
      - name: Download the package CI built
        if: steps.tip.outputs.deploy == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: landing
          path: landing/.vercel/output
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Deploy to production
        if: steps.tip.outputs.deploy == 'true'
        working-directory: landing
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TELEMETRY_DISABLED: "1"
        run: |
          for setting in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            if [ -z "${!setting}" ]; then
              echo "::error::Missing $setting. See openspec/deployment/vercel.md."
              exit 1
            fi
          done
          # The CLI output can include private project details, so it is not published.
          deployment_log="$(mktemp "${RUNNER_TEMP}/zellige-deploy.XXXXXX")"
          trap 'rm -f "$deployment_log"' EXIT
          if ! npm exec --ignore-scripts --yes --package=vercel@62.2.0 -- vercel deploy --prebuilt --prod --yes --meta sourceSha="$APPROVED_SHA" --token="$VERCEL_TOKEN" >"$deployment_log" 2>&1; then
            # Only the CLI's error lines (such as the daily deployment limit), with
            # Vercel identifiers and URLs redacted.
            grep -m 5 -E 'Error|error:' "$deployment_log" \
              | sed -E 's/(team|prj|dpl)_[A-Za-z0-9]+/\1_<redacted>/g; s#[^ ]*vercel\.(app|com)[^ ]*#<vercel-url>#g' \
              | while IFS= read -r line; do echo "::error::Vercel: $line"; done || true
            echo "::error::Deployment failed. Check the Vercel dashboard; the rest of the CLI output is not published."
            exit 1
          fi
          echo "Production landing deployed."

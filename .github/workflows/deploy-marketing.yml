name: Deploy marketing to Vercel

on:
  workflow_call:
    secrets:
      VERCEL_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: marketing-production
  queue: max
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish the public landing
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: marketing-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: marketing/package-lock.json
      - name: Check changes since this application was deployed
        id: scope
        env:
          DEPLOY_TARGET: marketing
          APPROVED_BRANCH: ${{ github.event.pull_request.base.ref }}
          APPROVED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node deploy/deployment-scope.mjs
      - name: Build the React landing
        if: steps.scope.outputs.changed == 'true'
        working-directory: marketing
        run: |
          npm ci
          npm run build
      - name: Verify the built page and the public deployment boundary
        if: steps.scope.outputs.changed == 'true'
        run: node --test tests/marketing.test.mjs tests/marketing-build.test.mjs tests/release-head.test.mjs
      - name: Package the static landing
        if: steps.scope.outputs.changed == 'true'
        run: node deploy/build-marketing.mjs
      - name: Deploy the packaged landing to production
        if: steps.scope.outputs.changed == 'true'
        working-directory: .output/marketing
        env:
          APPROVED_BRANCH: ${{ github.event.pull_request.base.ref }}
          APPROVED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TELEMETRY_DISABLED: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          latest_sha="$(node "$GITHUB_WORKSPACE/deploy/release-head.mjs")"
          if [ "$latest_sha" != "$APPROVED_SHA" ]; then
            echo "A newer branch commit superseded this landing release."
            exit 0
          fi
          for setting in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            if [ -z "${!setting}" ]; then
              echo "::error::Missing $setting. See docs/deployment/vercel.md."
              exit 1
            fi
          done
          deployment_log="$(mktemp "${RUNNER_TEMP}/zellige-deploy.XXXXXX")"
          trap 'rm -f "$deployment_log"' EXIT
          if ! npm exec --yes --package=vercel@62.2.0 -- vercel deploy --prebuilt --prod --yes --meta sourceSha="$APPROVED_SHA" --token="$VERCEL_TOKEN" >"$deployment_log" 2>&1; then
            DEPLOYMENT_LOG="$deployment_log" node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const log = readFileSync(process.env.DEPLOYMENT_LOG, "utf8");
              for (const [label, pattern] of Object.entries({
                authentication: /token|credentials|unauthorized|forbidden/i,
                gitAuthor: /git author|commit author/i,
                projectAccess: /project.*(not found|access|exist)/i,
                prebuiltConfig: /prebuilt|output directory|config.json/i,
                rateLimit: /rate.?limit|too many|429/i,
                cliInstall: /ETARGET|ENOTFOUND|EAI_AGAIN/i,
                invalidOption: /unknown.*option|invalid.*argument/i,
                runtimeConfig: /runtime|function|version/i,
              })) if (pattern.test(log)) console.log(`CLI diagnostic category: ${label}`);
            '
            echo "::error::Deployment failed. Check the private Vercel dashboard and Actions settings; raw CLI output is not published."
            exit 1
          fi
          echo "Production landing deployed."
